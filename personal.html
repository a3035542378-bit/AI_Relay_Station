<!doctype html><html lang="zh-CN"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>我的 API 和模型</title>
<style>
*{box-sizing:border-box}body{font:16px/1.5 system-ui,sans-serif;max-width:760px;margin:5vh auto;padding:0 1.2rem;color:#193932;background:#f6f8f6}a{color:#20594b}h1{font-size:1.8rem}h2{font-size:1.15rem}form,article{background:white;border:1px solid #d4ded7;border-radius:12px;padding:1rem;margin:.7rem 0}label{display:block;margin:.7rem 0}input{display:block;width:100%;padding:.55rem;font:inherit;border:1px solid #9bada3;border-radius:6px}button{font:inherit;border:1px solid #81998c;border-radius:6px;background:white;padding:.35rem .9rem;margin-right:.4rem;cursor:pointer}button[type=submit]{background:#20594b;color:white}small{display:block;color:#476255;overflow-wrap:anywhere;margin:.3rem 0 .6rem}
</style><a href="/">← 返回聊天</a><h1>我的 API 和模型</h1>
<p>添加兼容 OpenAI 聊天接口的模型。保存后，在聊天页的模型列表中选择。</p>
<div id="list"></div><form id="form"><h2 id="title">添加个人模型</h2>
<label>显示名称<input name="name" required maxlength="100" placeholder="我的办公模型"></label>
<label>服务地址（Base URL）<input name="endpoint" type="url" required placeholder="https://api.example.com/v1"></label>
<label>模型 ID<input name="model" required maxlength="200" placeholder="填写服务商提供的模型 ID"></label>
<label>API Key<input name="key" type="password" required autocomplete="new-password"></label>
<button type="submit">保存模型</button><button type="button" id="cancel" hidden>取消编辑</button></form>
<p id="status" role="status"></p><script>
const api='/api/office/personal-models', form=document.querySelector('#form'), list=document.querySelector('#list'), statusBox=document.querySelector('#status'), cancel=document.querySelector('#cancel');
let editing=null;
async function request(url,options={}) {
 const r=await fetch(url,{cache:'no-store',...options});
 if(!r.ok){const d=await r.json().catch(()=>({}));throw Error(typeof d.detail==='string'?d.detail:'操作失败，请检查登录状态及表单内容');}
 return r.json();
}
function reset(){editing=null; form.reset(); form.elements.key.required=true;form.elements.key.placeholder='';cancel.hidden=true;document.querySelector('#title').textContent='添加个人模型';}
async function show(){
 const rows=await request(api);list.replaceChildren();
 for(const row of rows){
  const card=document.createElement('article'),name=document.createElement('strong'),info=document.createElement('small');
  name.textContent=row.name;info.textContent=row.model+' · '+row.endpoint;
  const edit=document.createElement('button'),remove=document.createElement('button');
  edit.textContent='编辑'; remove.textContent='删除';
  edit.onclick=()=>{reset();editing=row.id;for(const k of ['name','endpoint','model'])form.elements[k].value=row[k];form.elements.key.required=false;form.elements.key.placeholder='保留原密钥可留空，更换地址请重新填写';document.querySelector('#title').textContent='编辑个人模型';cancel.hidden=false;form.elements.name.focus();};
  remove.onclick=async()=>{if(!confirm('删除个人模型「'+row.name+'」？'))return;try{await request(api+'/'+encodeURIComponent(row.id),{method:'DELETE'});if(editing===row.id)reset();await show();statusBox.textContent='已删除。';}catch(e){statusBox.textContent=e.message;}};
  card.append(name,info,edit,remove);list.append(card);
 }
}
cancel.onclick=reset;
form.onsubmit=async e=>{e.preventDefault();const submit=form.querySelector('[type=submit]');submit.disabled=true;try{
 const data=Object.fromEntries(new FormData(form)); if(!data.key)delete data.key;
 await request(api+(editing?'/'+encodeURIComponent(editing):''),{method:editing?'PUT':'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify(data)});
 reset();await show();statusBox.textContent='已保存，返回聊天后即可选择。';
}catch(e){statusBox.textContent=e.message;}finally{submit.disabled=false;}};
show().catch(e=>statusBox.textContent=e.message);
</script></html>
