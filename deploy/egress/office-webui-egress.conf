[Unit]
Wants=office-egress.service
After=office-egress.service
[Service]
ExecStartPre=+/opt/office-egress/routes start
ExecStopPost=+/opt/office-egress/routes stop
BindReadOnlyPaths=/opt/office-egress/resolv.conf:/etc/resolv.conf
UnsetEnvironment=HTTP_PROXY HTTPS_PROXY ALL_PROXY http_proxy https_proxy all_proxy
