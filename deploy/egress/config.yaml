mode: rule
log-level: silent
ipv6: true
allow-lan: false
external-controller-unix: /var/lib/office-egress/control.sock
tun:
  enable: true
  device: office-tun
  stack: gvisor
  mtu: 1500
  auto-route: false
  auto-redirect: false
  auto-detect-interface: false
  inet6-address: ["fd7a:70f1:ce12::1/126"]
  dns-hijack: ["any:53", "tcp://any:53"]
dns:
  enable: true
  enhanced-mode: fake-ip
  fake-ip-range: 198.19.0.1/16
  ipv6: true
  default-nameserver: [223.5.5.5, 119.29.29.29]
  proxy-server-nameserver: ["https://223.5.5.5/dns-query"]
  nameserver: ["https://1.1.1.1/dns-query#Office"]
proxy-providers:
  subscription:
    type: file
    path: ./nodes.yaml
    health-check:
      enable: true
      url: https://www.gstatic.com/generate_204
      interval: 900
      timeout: 5000
proxy-groups:
  - name: Office
    type: fallback
    use: [subscription]
    url: https://www.gstatic.com/generate_204
    interval: 900
    timeout: 5000
rules:
  - MATCH,Office
